services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tally
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: tally
    ports: ["5435:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tally -d tally"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  stripe-mock:
    image: stripe/stripe-mock:latest
    ports: ["12111:12111"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "12111"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object store. MinIO withdrew its free images in September 2026;
  # RustFS is a drop-in with the same ports and credential envs.
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: tally
      RUSTFS_SECRET_KEY: tally12345
    ports: ["9000:9000", "9001:9001"]
    volumes: ["s3data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3-init:
    image: amazon/aws-cli
    depends_on:
      s3: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: tally
      AWS_SECRET_ACCESS_KEY: tally12345
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "aws --endpoint-url http://s3:9000 s3api head-bucket --bucket reports 2>/dev/null
      || aws --endpoint-url http://s3:9000 s3 mb s3://reports"

  # Nightly report orchestrator. `docker compose --profile batch up -d`; UI on 8081, no login.
  # Metadata DB is a second database on the same Postgres; Tally itself runs on the host
  # (make dev), reached as host.docker.internal:8001.
  airflow:
    image: apache/airflow:3.1.8
    profiles: ["batch"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://tally:tally@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      AIRFLOW_CONN_TALLY: http://host.docker.internal:8001
      AIRFLOW_VAR_TALLY_INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      TALLY_DATABASE_URL: postgresql://tally:tally@postgres:5432/tally
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8081:8080"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./docker/airflow-init.sh:/airflow-init.sh:ro
    entrypoint: ["/airflow-init.sh"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  s3data:
