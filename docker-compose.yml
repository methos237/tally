services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tally
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: tally
    ports: ["5435:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tally -d tally"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  stripe-mock:
    image: stripe/stripe-mock:latest
    ports: ["12111:12111"]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "12111"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object store. MinIO withdrew its free images in September 2026;
  # RustFS is a drop-in with the same ports and credential envs.
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: tally
      RUSTFS_SECRET_KEY: tally12345
    ports: ["9000:9000", "9001:9001"]
    volumes: ["s3data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3-init:
    image: amazon/aws-cli
    depends_on:
      s3: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: tally
      AWS_SECRET_ACCESS_KEY: tally12345
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "aws --endpoint-url http://s3:9000 s3api head-bucket --bucket reports 2>/dev/null
      || aws --endpoint-url http://s3:9000 s3 mb s3://reports"

volumes:
  pgdata:
  s3data:
