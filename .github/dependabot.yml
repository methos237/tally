version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /console
    schedule: { interval: weekly }
    ignore:
      # typescript-eslint does not support TypeScript 7 yet; lift when it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      console:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
