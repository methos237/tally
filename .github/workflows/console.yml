name: console

on:
  push:
    branches: [master]
    paths: ["console/**", ".github/workflows/console.yml"]
  pull_request:
    paths: ["console/**", ".github/workflows/console.yml"]

defaults:
  run:
    working-directory: console

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npx prettier --check src/
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
