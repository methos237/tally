name: console

on:
  push:
    branches: [master]
    paths: ["console/**", ".github/workflows/console.yml"]
  # No paths filter on pull_request: both checks are required by the master
  # ruleset, and a required check that never runs blocks the merge.
  pull_request:

defaults:
  run:
    working-directory: console

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npx prettier --check src/
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
